# .github/workflows/validate_game_data.yml
name: Validate Game Data

# res://Data/json/ is the single source of truth the game loads at runtime and
# res://Data/xlsx/game_data.xlsx is only a bulk-entry authoring tool. Both are
# checked here, together with the GDScript compile gate, the generated symbol
# index in Docs/ and the gdUnit4 suite, so a broken data edit, a typing
# regression or a stale code map cannot reach main.
#
# Actions are pinned to commit SHAs on purpose: a moving major tag is a supply
# chain risk. The trailing comment records the version each SHA was verified at.
on:
  # No `paths:` filter on purpose: the `validate` job is a *required* status
  # check on main, and a required check that never runs would leave every pull
  # request stuck on "Expected — Waiting for status to be reported".
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The pipeline only ever reads the repository; the test job additionally asks
# for checks:write so it can publish its report.
permissions:
  contents: read

# A newer push to the same ref supersedes the previous run.
concurrency:
  group: validate-game-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Godot version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      godot: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read config/features straight out of project.godot, e.g.
      # config/features=PackedStringArray("4.7", "GL Compatibility").
      - name: Read version from project.godot
        id: read
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'features=PackedStringArray\([^)]*\)' project.godot \
                    | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read config/features from project.godot"
            exit 1
          fi
          # setup-godot needs major.minor.patch: "4.7" -> "4.7.0".
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          echo "Resolved Godot version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Job id stays `validate` (with no `name:`) so the branch-protection rule that
  # requires the `validate` status check keeps matching this job.
  validate:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: ${{ needs.version.outputs.godot }}
          use-dotnet: false

      # A fresh checkout has no .godot/, so import before anything reads classes.
      - name: Import project
        timeout-minutes: 5
        run: godot --headless --path . --import

      # Validates the raw JSON schema/semantics, the DataLoader path and the
      # workbook. Errors and warnings are annotated inline on the PR and
      # summarised on the job page; --strict makes warnings fatal as well, so a
      # warning-free data set is the requirement to merge.
      - name: Validate game data
        timeout-minutes: 5
        run: godot --headless --path . "res://Tools/validator.tscn" -- --strict

      # Architectural back pressure: bans imperative timers, frame pumps and
      # upward tree walks, keeps Node types out of Core/, and ratchets file size,
      # function size, function branching and get_parent() use. --strict is
      # deliberate: a stale ratchet entry would otherwise only warn, leaving slack
      # for the next change to fill back in. Same script preflight.ps1 runs.
      - name: Anti-slop lint
        timeout-minutes: 2
        run: python3 Tools/line_godot_slop.py --strict

  project:
    name: Scripts and tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: ${{ needs.version.outputs.godot }}
          use-dotnet: false

      - name: Import project
        timeout-minutes: 5
        run: godot --headless --path . --import

      # Loads every project script, so a type error or a stale class_name fails
      # the build instead of only surfacing when the affected scene is opened.
      - name: Compile all scripts
        timeout-minutes: 5
        run: godot --headless --path . --script res://Tools/check_scripts.gd

      # The committed navigation set (Docs/) is what a reader trusts instead of
      # opening files, so it must match the sources: this harness checks coverage,
      # ranges, links, scenes, signals and data against the sources, exercises the
      # generator in a scratch directory, and fails when a code change forgot to
      # regenerate the map.
      - name: Check navigation index
        timeout-minutes: 10
        run: godot --headless --path . --script res://Tools/check_navigation.gd

      # gdUnit4 refuses to run in headless mode unless that check is ignored;
      # -c keeps going after the first failure so the log lists every failure.
      - name: Unit tests
        timeout-minutes: 10
        run: |
          godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a res://GDTest -c --ignoreHeadlessMode

      # The headless gates cannot see pixels. This renders the canonical UI screens
      # with the real OpenGL renderer on a virtual framebuffer and sanity-checks
      # the PNGs, so a layout or shader regression is visible on the pull request.
      - name: UI snapshots (rendered)
        timeout-minutes: 10
        run: |
          command -v xvfb-run >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri)
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy \
            --rendering-driver opengl3 --path . res://Tools/snapshot_runner.tscn

      # The images leave the runner as an artifact; reports/ is gitignored.
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-snapshots
          path: reports/ui-snapshots/
          if-no-files-found: warn
          retention-days: 7

      # A small table on the job page, so the shots are one click away.
      - name: Summarise UI snapshots
        if: always()
        run: |
          if [ -f reports/ui-snapshots/manifest.json ]; then
            {
              echo '### UI snapshots'
              echo ''
              echo '| shot | bytes | sha256 |'
              echo '| --- | --- | --- |'
              jq -r '.shots[] | "| \(.file) | \(.bytes) | `\(.sha256[0:12])` |"' \
                reports/ui-snapshots/manifest.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # reports/ is gitignored, so the HTML/XML report only ever leaves the
      # runner as a build artifact.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      # Publishes the JUnit XML as a check run (test table + annotations on the
      # failing lines). Never fails the job: PRs from forks only get a read-only
      # token, so creating a check run is not permitted there.
      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: gdUnit4
          path: reports/*/results.xml
          reporter: java-junit

  # Second-pass review: a diff-scoped report posted on the pull request, so the first
  # look at a change is a summary plus a short list of review-worthy items instead of a
  # raw diff. Advisory by design - the hard gates (`validate`, `Scripts and tests`) are
  # the blockers - and it never fails a fork build, which only gets a read-only token.
  review:
    name: Second-pass review
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: ${{ needs.version.outputs.godot }}
          use-dotnet: false

      - name: Import project
        timeout-minutes: 5
        run: godot --headless --path . --import

      # The exact base commit, so the diff is the pull request and nothing else.
      # `--adversarial` appends the context-isolated brief; the formatter wraps it in
      # <details> for markdown, so it is one click away instead of lengthening the comment.
      - name: Review the diff
        run: |
          godot --headless --path . --script res://Tools/review_diff.gd -- \
            --base ${{ github.event.pull_request.base.sha }} \
            --format markdown --adversarial --output review.md

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-pass-review
          path: review.md
          if-no-files-found: warn
          retention-days: 7

      # One sticky comment: edited in place on each push instead of spamming the thread.
      - name: Comment on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file review.md --edit-last --create-if-none
